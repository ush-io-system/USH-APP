<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USH — Universal Data Ecosystem</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand-logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-main);
        }
        .brand-logo span {
            color: var(--accent-color);
        }
        .brand-tagline {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .upload-box:hover {
            border-color: var(--accent-color);
            background: rgba(59, 130, 246, 0.05);
        }
        .upload-box p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 10px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #2563eb;
        }
        .status {
            margin-top: 20px;
            font-size: 13px;
            text-align: center;
            color: var(--text-muted);
        }
        .footer-note {
            margin-top: 25px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <div class="brand-logo">U S H<span>.</span></div>
            <div class="brand-tagline">Secure Universal Ecosystem</div>
        </div>

        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--accent-color);">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
            </svg>
            <p id="fileLabel">Tap to select data or files to port</p>
            <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
        </div>

        <button class="btn" onclick="uploadData()">Secure & Port to USH Cloud</button>

        <div class="status" id="statusText">System Ready. End-to-End Encrypted.</div>

        <div class="footer-note">
            Powered by USH Global Technologies. Zero-Knowledge Architecture.
        </div>
    </div>

    <script>
        let selectedFile = null;

        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                document.getElementById('fileLabel').innerText = `Selected: ${selectedFile.name}`;
            }
        }

        function uploadData() {
            if (!selectedFile) {
                alert("Please select a file first.");
                return;
            }
            
            const statusText = document.getElementById('statusText');
            statusText.style.color = "#3b82f6";
            statusText.innerText = "Encrypting data locally...";

            setTimeout(() => {
                statusText.innerText = "Porting to USH Secure Vault...";
                setTimeout(() => {
                    statusText.style.color = "#10b981";
                    statusText.innerText = "Success! Data safely ported to USH ecosystem.";
                }, 1500);
            }, 1500);
        }
    </script>

</body>
</html>
